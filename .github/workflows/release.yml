name: release

# Stable-only releases. Tags like v1.2.3 trigger build + publish.
# No beta/nightly channels (see ARCHITECTURE.md §4).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    # Windows-only product: single runner, no matrix.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard updater config (no placeholders on tag builds)
        shell: bash
        run: |
          PUBKEY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).plugins.updater.pubkey)")
          ENDPOINT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).plugins.updater.endpoints[0])")
          if [ "$PUBKEY" = "TAURI_UPDATER_PUBKEY" ]; then echo "updater pubkey placeholder — run keygen and update tauri.conf.json"; exit 1; fi
          case "$ENDPOINT" in *USER/*) echo "updater endpoint still USER/ — run: npm run updater:endpoint -- <owner/repo>"; exit 1;; esac
          echo "updater OK: $ENDPOINT"

      # TODO: frontend worker owns package.json — keep in sync with node version here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build signed bundles (tauri build signs updater artifacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # Publishes installers + updater feed directly. (tauri-action was
      # dropping the updater payload in this environment, and cleans the bundle
      # dir after upload — so this pipeline builds with the Tauri CLI and owns
      # every upload itself. Updater payload is version+arch only, no telemetry.)
      - name: Publish release + updater artifacts
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const cp = require("child_process");
          const repo = "SUMANTHXT900/tokentracker";
          const tag = process.env.TAG;
          const sh = (cmd) => cp.execSync(cmd, { stdio: "inherit" });
          function walk(dir, out) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p, out);
              else out.push(p);
            }
            return out;
          }
          const root = path.join(process.cwd(), "src-tauri", "target", "release", "bundle");
          let all = [];
          try { all = walk(root, []); } catch (e) { console.error("FAIL: bundle tree missing: " + e.message); process.exit(1); }
          console.log("bundle files:\n" + all.join("\n"));
          // With createUpdaterArtifacts:true the Windows updater bundle IS the
          // signed installer itself (setup.exe + setup.exe.sig). The .nsis.zip
          // layout only exists under the legacy "v1Compatible" mode.
          const exe = all.find((f) => f.endsWith("-setup.exe"));
          if (!exe) { console.error("FAIL: no setup.exe under bundle tree"); process.exit(1); }
          const sig = fs.readFileSync(exe + ".sig", "utf8").trim();
          if (!sig) { console.error("FAIL: empty signature for " + exe); process.exit(1); }
          const exeName = path.basename(exe);
          const latest = {
            version: tag,
            notes: "tokentracker " + tag,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: sig,
                url: "https://github.com/" + repo + "/releases/download/" + tag + "/" + exeName,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2) + "\n");
          console.log("latest.json -> " + latest.platforms["windows-x86_64"].url);
          try {
            cp.execSync("gh release view " + tag + " --repo " + repo, { stdio: "pipe" });
            console.log("release exists, uploading into it");
          } catch {
            sh("gh release create " + tag + " --title \"tokentracker " + tag + "\" --notes \"tokentracker " + tag + "\" --repo " + repo);
          }
          const want = ["latest.json", exe, exe + ".sig"];
          for (const f of all) {
            if ((f.endsWith("-setup.exe") || f.endsWith(".msi")) && !want.includes(f)) want.push(f);
            if (f.endsWith(".sig") && !want.includes(f)) want.push(f);
          }
          sh("gh release upload " + tag + " " + want.map((f) => "\"" + f + "\"").join(" ") + " --clobber --repo " + repo);
          console.log("uploaded " + want.length + " files");
          '

      # Updater payload is version+arch only (no telemetry) — see ARCHITECTURE.md §4.
