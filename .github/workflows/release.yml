name: release

# Stable-only releases. Tags like v1.2.3 trigger build + publish.
# No beta/nightly channels (see ARCHITECTURE.md §4).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    # Windows-only product: single runner, no matrix.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard updater config (no placeholders on tag builds)
        shell: bash
        run: |
          PUBKEY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).plugins.updater.pubkey)")
          ENDPOINT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).plugins.updater.endpoints[0])")
          if [ "$PUBKEY" = "TAURI_UPDATER_PUBKEY" ]; then echo "updater pubkey placeholder — run keygen and update tauri.conf.json"; exit 1; fi
          case "$ENDPOINT" in *USER/*) echo "updater endpoint still USER/ — run: npm run updater:endpoint -- <owner/repo>"; exit 1;; esac
          echo "updater OK: $ENDPOINT"

      # TODO: frontend worker owns package.json — keep in sync with node version here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm ci

      - name: Build + publish with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO(secrets): add TAURI_SIGNING_PRIVATE_KEY (repo Settings → Secrets → Actions)
          # Generate via: tauri signer generate -w ~/.tauri/tokentracker.key
          # Public key must match src-tauri/tauri.conf.json > plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TODO(secrets): add TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "tokentracker ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG for details."
          releaseDraft: false
          prerelease: false

      # tauri-action sometimes skips the updater payload ("Signature not found
      # for the updater JSON"). This step builds latest.json deterministically
      # from the freshly signed NSIS bundle and uploads every updater artifact,
      # so the in-app updater can never be left without its feed.
      - name: Publish updater artifacts (latest.json + nsis.zip + sigs)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const cp = require("child_process");
          const repo = "SUMANTHXT900/tokentracker";
          const tag = process.env.TAG;
          const dir = "src-tauri/target/release/bundle/nsis";
          const files = fs.readdirSync(dir);
          const zip = files.find((f) => f.endsWith(".nsis.zip"));
          if (!zip) { console.error("nsis.zip not found in " + dir); process.exit(1); }
          const sig = fs.readFileSync(path.join(dir, zip + ".sig"), "utf8").trim();
          if (!sig) { console.error("empty signature for " + zip); process.exit(1); }
          const latest = {
            version: tag,
            notes: "tokentracker " + tag,
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: sig,
                url: "https://github.com/" + repo + "/releases/download/" + tag + "/" + zip,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2) + "\n");
          console.log("latest.json -> " + latest.platforms["windows-x86_64"].url);
          cp.execSync(
            "gh release upload " + tag +
            " \"" + path.join(dir, zip) + "\"" +
            " \"" + path.join(dir, zip) + ".sig\"" +
            " latest.json --clobber --repo " + repo,
            { stdio: "inherit" },
          );
          '

      # tauri-action uploads bundles + generates latest.json for the updater.
      # Updater payload is version+arch only (no telemetry) — see ARCHITECTURE.md §4.
